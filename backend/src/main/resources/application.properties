spring.config.import=optional:file:.env[.properties]

spring.application.name=Studymaterial

# ---------- MySQL ----------
# createDatabaseIfNotExist=true => MySQL creates "studymaterial_db" automatically on first run
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studymaterial_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# Hibernate creates / updates the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Must stay true: the JSON tree (syllabus -> units -> topics) loads lazily while serializing
spring.jpa.open-in-view=true

server.port=${PORT:8080}

# Readable messages for 404 / 400 errors
server.error.include-message=always

# Allowed frontend origins (comma-separated)
app.cors.origin=${APP_CORS_ORIGIN:http://localhost:5173}

# ---------- Admin login (used by http://localhost:5173/admin) ----------
app.admin.username=${ADMIN_USER:Yuvraj}
app.admin.password=${ADMIN_PASS:change-me}

# ---------- LLM (any OpenAI-compatible chat API: Gemini, OpenAI, Groq, ...) ----------
# Set LLM_API_KEY in backend/.env or the backend environment. The key stays server-side.
llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-flash-latest}
llm.timeout-seconds=${LLM_TIMEOUT:120}
